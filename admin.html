<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Train With Buse</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    :root {
      --cream: #FDF6F0;
      --cream-deep: #F5EBE0;
      --rose: #C1848B;
      --rose-dark: #9B6B6F;
      --charcoal: #2D2A2E;
      --charcoal-light: #4A4548;
      --gold: #C8A96E;
      --nude: #D4A89A;
      --green: #3B6D11;
      --green-light: #EAF3DE;
      --amber: #854F0B;
      --amber-light: #FAEEDA;
      --red: #A32D2D;
      --red-light: #FCEBEB;
      --purple: #3C3489;
      --purple-light: #EEEDFE;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: var(--cream-deep); color: var(--charcoal); min-height: 100vh; }

    /* LOGIN */
    .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-card { background: #fff; border-radius: 24px; padding: 44px; max-width: 400px; width: 100%; border: 1px solid rgba(232,180,184,.15); box-shadow: 0 16px 48px rgba(45,42,46,.08); }
    .login-logo { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; letter-spacing: 3px; text-align: center; margin-bottom: 8px; }
    .login-sub { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--rose); text-align: center; margin-bottom: 32px; }
    .login-input { width: 100%; padding: 13px 16px; border-radius: 12px; border: 1.5px solid rgba(232,180,184,.3); background: #fff; font-family: 'Outfit', sans-serif; font-size: 14px; color: var(--charcoal); outline: none; margin-bottom: 12px; transition: border .2s; }
    .login-input:focus { border-color: var(--rose); }
    .login-btn { width: 100%; padding: 14px; border-radius: 50px; background: var(--charcoal); color: var(--cream); font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; border: none; cursor: pointer; transition: all .3s; }
    .login-btn:hover { background: var(--rose-dark); }
    .login-error { font-size: 13px; color: var(--red); text-align: center; margin-top: 10px; display: none; }

    /* TOPBAR */
    .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 58px; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; background: rgba(253,246,240,.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(232,180,184,.15); }
    .topbar-logo { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; letter-spacing: 3px; }
    .topbar-tag { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--rose); font-weight: 600; background: rgba(193,132,139,.1); padding: 3px 10px; border-radius: 20px; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .signout-btn { font-size: 12px; color: var(--charcoal-light); cursor: pointer; letter-spacing: .5px; background: none; border: none; }
    .signout-btn:hover { color: var(--rose); }

    /* LAYOUT */
    .layout { max-width: 860px; margin: 78px auto 0; padding: 24px; }

    /* STATS */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px; }
    .stat-card { background: #fff; border-radius: 14px; padding: 16px; border: 1px solid rgba(232,180,184,.12); text-align: center; }
    .stat-num { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 400; color: var(--charcoal); line-height: 1; margin-bottom: 4px; }
    .stat-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--charcoal-light); }

    /* TABS */
    .tabs-row { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid rgba(232,180,184,.15); }
    .tab-btn { padding: 10px 4px; margin-right: 20px; font-size: 13px; font-weight: 500; letter-spacing: .3px; cursor: pointer; border: none; background: none; color: var(--charcoal-light); border-bottom: 2px solid transparent; transition: all .2s; font-family: 'Outfit', sans-serif; }
    .tab-btn:hover { color: var(--charcoal); }
    .tab-btn.active { color: var(--rose-dark); border-bottom-color: var(--rose); }

    /* INQUIRY CARD */
    .inquiry-card { background: #fff; border-radius: 18px; padding: 20px 22px; margin-bottom: 12px; border: 1px solid rgba(232,180,184,.15); }
    .iq-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; gap: 12px; }
    .iq-name { font-size: 15px; font-weight: 500; color: var(--charcoal); margin-bottom: 3px; }
    .iq-contact { font-size: 12px; color: var(--charcoal-light); }
    .iq-date { font-size: 11px; color: var(--charcoal-light); white-space: nowrap; }
    .iq-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; margin-bottom: 12px; }
    .iq-field-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--charcoal-light); margin-bottom: 2px; }
    .iq-field-value { font-size: 13px; color: var(--charcoal); }
    .iq-parq-flag { color: var(--red); font-weight: 600; }
    .iq-note { font-size: 13px; color: var(--charcoal-light); background: var(--cream-deep); border-radius: 10px; padding: 10px 12px; margin-top: 8px; line-height: 1.6; white-space: pre-wrap; }
    .iq-note-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--charcoal-light); margin-bottom: 6px; margin-top: 12px; }

    /* FILTER */
    .filter-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-btn { padding: 7px 16px; border-radius: 50px; font-size: 12px; letter-spacing: .5px; cursor: pointer; border: 1.5px solid rgba(232,180,184,.25); background: #fff; color: var(--charcoal-light); transition: all .2s; font-family: 'Outfit', sans-serif; }
    .filter-btn:hover { border-color: var(--rose); color: var(--rose); }
    .filter-btn.active { border-color: var(--rose); background: rgba(193,132,139,.07); color: var(--rose-dark); font-weight: 500; }

    /* SECTION */
    .section-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--charcoal-light); font-weight: 500; margin-bottom: 12px; margin-top: 4px; }

    /* BOOKING CARD */
    .booking-card { background: #fff; border-radius: 18px; padding: 20px 22px; margin-bottom: 12px; border: 1px solid rgba(232,180,184,.15); transition: all .2s; }
    .booking-card:hover { border-color: rgba(232,180,184,.35); }
    .bc-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
    .bc-name { font-size: 15px; font-weight: 500; color: var(--charcoal); margin-bottom: 3px; }
    .bc-email { font-size: 12px; color: var(--charcoal-light); }
    .bc-type { font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 1px solid rgba(232,180,184,.25); color: var(--charcoal-light); margin-left: 8px; vertical-align: middle; }
    .badge { font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 20px; white-space: nowrap; }
    .badge-pending { background: var(--amber-light); color: var(--amber); }
    .badge-confirmed { background: var(--green-light); color: var(--green); }
    .badge-alternative { background: var(--purple-light); color: var(--purple); }
    .badge-cancelled { background: var(--red-light); color: var(--red); }

    .bc-slots { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .slot-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--charcoal-light); }
    .slot-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(45,42,46,.2); flex-shrink: 0; }
    .slot-dot.primary { background: var(--rose); }

    .bc-note { font-size: 12px; color: var(--charcoal-light); background: var(--cream-deep); border-radius: 10px; padding: 9px 12px; margin-bottom: 12px; line-height: 1.6; }

    .bc-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn-confirm { font-size: 12px; padding: 7px 14px; border-radius: 10px; border: 1px solid var(--green); background: var(--green-light); color: var(--green); cursor: pointer; font-family: 'Outfit', sans-serif; font-weight: 500; transition: all .2s; }
    .btn-confirm:hover { background: var(--green); color: #fff; }
    .btn-alt { font-size: 12px; padding: 7px 14px; border-radius: 10px; border: 1px solid rgba(45,42,46,.15); background: var(--cream-deep); color: var(--charcoal); cursor: pointer; font-family: 'Outfit', sans-serif; transition: all .2s; }
    .btn-alt:hover { border-color: var(--purple); color: var(--purple); }
    .btn-decline { font-size: 12px; padding: 7px 14px; border-radius: 10px; border: 1px solid var(--red); background: var(--red-light); color: var(--red); cursor: pointer; font-family: 'Outfit', sans-serif; transition: all .2s; }
    .btn-decline:hover { background: var(--red); color: #fff; }
    .btn-contacted { font-size: 12px; padding: 7px 14px; border-radius: 10px; border: 1px solid var(--amber); background: var(--amber-light); color: var(--amber); cursor: pointer; font-family: 'Outfit', sans-serif; font-weight: 500; transition: all .2s; }
    .btn-contacted:hover { background: var(--amber); color: #fff; }
    .btn-contacted.is-contacted { border-color: var(--green); background: var(--green-light); color: var(--green); }
    .btn-contacted.is-contacted:hover { background: var(--green); color: #fff; }
    .btn-delete { font-size: 11px; padding: 7px 12px; border-radius: 10px; border: 1px solid transparent; background: none; color: var(--charcoal-light); cursor: pointer; font-family: 'Outfit', sans-serif; transition: all .2s; margin-left: auto; }
    .btn-delete:hover { color: var(--red); border-color: var(--red); background: var(--red-light); }

    .alt-panel { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(232,180,184,.15); }
    .alt-panel.show { display: block; }
    .alt-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .alt-row input { flex: 1; padding: 10px 13px; border-radius: 10px; border: 1.5px solid rgba(232,180,184,.25); font-family: 'Outfit', sans-serif; font-size: 13px; color: var(--charcoal); outline: none; }
    .alt-row input:focus { border-color: var(--rose); }
    .btn-send-alt { font-size: 12px; padding: 9px 18px; border-radius: 50px; background: var(--charcoal); color: var(--cream); border: none; cursor: pointer; font-family: 'Outfit', sans-serif; letter-spacing: 1px; transition: all .2s; }
    .btn-send-alt:hover { background: var(--rose-dark); }

    .confirmed-info { font-size: 13px; color: var(--green); font-weight: 500; }

    .empty { text-align: center; padding: 40px; color: var(--charcoal-light); font-size: 14px; }

    @media (max-width: 600px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .topbar { padding: 0 16px; }
      .layout { padding: 16px; }
      .iq-fields { grid-template-columns: 1fr; }
      .tabs-row { gap: 4px; }
      .tab-btn { margin-right: 12px; font-size: 12px; }
      .iq-top { flex-direction: column; gap: 6px; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="login-logo">BUSE</div>
    <div class="login-sub">Admin Panel</div>
    <input type="email" class="login-input" id="adminEmail" placeholder="Email" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('adminPass').focus()">
    <input type="password" class="login-input" id="adminPass" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')checkPass()">
    <button class="login-btn" onclick="checkPass()">Sign In</button>
    <div class="login-error" id="loginError">Incorrect email or password.</div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" style="display:none;">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="topbar-logo">BUSE</div>
      <div class="topbar-tag">Admin</div>
    </div>
    <div class="topbar-right">
      <button class="signout-btn" onclick="signOut()">Sign Out</button>
    </div>
  </div>

  <div class="layout">
    <div class="tabs-row">
      <button class="tab-btn active" id="tabBookingsBtn" onclick="switchTab('bookings')">Bookings</button>
      <button class="tab-btn" id="tabInquiriesBtn" onclick="switchTab('inquiries')">Inquiries</button>
      <button class="tab-btn" id="tabCorporateBtn" onclick="switchTab('corporate')">Corporate</button>
      <button class="tab-btn" id="tabParticipantsBtn" onclick="switchTab('participants')">Participants</button>
    </div>

    <div id="bookingsPanel">
      <div class="stats" id="statsRow"></div>

      <div class="filter-row">
        <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
        <button class="filter-btn" onclick="setFilter('pending',this)">Pending</button>
        <button class="filter-btn" onclick="setFilter('confirmed',this)">Confirmed</button>
        <button class="filter-btn" onclick="setFilter('alternative_proposed',this)">Alternative Sent</button>
        <button class="filter-btn" onclick="setFilter('cancelled',this)">Declined</button>
      </div>

      <div id="bookingsList"></div>
    </div>

    <div id="inquiriesPanel" style="display:none;">
      <div class="stats" id="inquiriesStatsRow"></div>
      <div class="filter-row">
        <button class="filter-btn active" onclick="setInquiryFilter('new',this)">New</button>
        <button class="filter-btn" onclick="setInquiryFilter('accepted',this)">Accepted</button>
        <button class="filter-btn" onclick="setInquiryFilter('rejected',this)">Rejected</button>
      </div>
      <div id="inquiriesList"></div>
    </div>

    <div id="corporatePanel" style="display:none;">
      <div class="stats" id="corporateStatsRow"></div>
      <div class="filter-row">
        <button class="filter-btn active" onclick="setCorporateFilter('new',this)">New</button>
        <button class="filter-btn" onclick="setCorporateFilter('accepted',this)">Accepted</button>
        <button class="filter-btn" onclick="setCorporateFilter('rejected',this)">Rejected</button>
      </div>
      <div id="corporateList"></div>
    </div>

    <div id="participantsPanel" style="display:none;">
      <div class="stats" id="participantsStatsRow"></div>
      <div id="participantsList"></div>
    </div>
  </div>
</div>

<script>
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// SECURITY NOTE — read before relying on this panel:
// This ADMIN_EMAILS allowlist is a UI convenience, not real access control. Anyone
// with the public Supabase anon key (visible in config.js, by design) can call the
// `bookings` table directly via the Supabase REST API regardless of what this page
// checks client-side. The actual security boundary MUST be a Row Level Security (RLS)
// policy on the `bookings` table in the Supabase dashboard, scoped to auth.uid() for
// this admin account. Verify that RLS policy exists and is correct before treating
// this page as a real access barrier — until then, treat bookings data as effectively
// readable by anyone who inspects the client code.
const ADMIN_EMAILS = ['hello@trainwithbuse.com']; // TODO: replace with your real admin login email(s)

let allBookings = [];
let currentFilter = 'all';

async function checkPass() {
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPass').value;
  const errorEl = document.getElementById('loginError');
  errorEl.style.display = 'none';

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error || !data.session) {
    errorEl.textContent = 'Incorrect email or password.';
    errorEl.style.display = 'block';
    return;
  }
  if (!ADMIN_EMAILS.includes(data.session.user.email)) {
    errorEl.textContent = "This account doesn't have admin access.";
    errorEl.style.display = 'block';
    await sb.auth.signOut();
    return;
  }
  showPanel();
}

function showPanel() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'block';
  loadBookings();
}

async function signOut() {
  await sb.auth.signOut();
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('adminEmail').value = '';
  document.getElementById('adminPass').value = '';
}

// If already signed in as an admin (e.g. returning visit), skip straight to the panel
(async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (session && ADMIN_EMAILS.includes(session.user.email)) {
    showPanel();
  }
})();

async function loadBookings() {
  const { data, error } = await sb
    .from('bookings')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) { console.error('Failed to load bookings:', error.message); alert('Could not load bookings: ' + error.message); return; }
  allBookings = data || [];
  renderStats();
  renderList();
}

function renderStats() {
  const total = allBookings.length;
  const pending = allBookings.filter(b => b.status === 'pending').length;
  const confirmed = allBookings.filter(b => b.status === 'confirmed').length;
  const alt = allBookings.filter(b => b.status === 'alternative_proposed').length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total</div></div>
    <div class="stat-card"><div class="stat-num">${pending}</div><div class="stat-label">Pending</div></div>
    <div class="stat-card"><div class="stat-num">${confirmed}</div><div class="stat-label">Confirmed</div></div>
    <div class="stat-card"><div class="stat-num">${alt}</div><div class="stat-label">Alt Sent</div></div>
  `;
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function renderList() {
  const list = document.getElementById('bookingsList');
  let items = allBookings;
  if (currentFilter !== 'all') items = items.filter(b => b.status === currentFilter);

  if (items.length === 0) {
    list.innerHTML = `<div class="empty">No bookings found.</div>`;
    return;
  }

  const pending = items.filter(b => b.status === 'pending');
  const others = items.filter(b => b.status !== 'pending');

  let html = '';

  if (pending.length > 0 && currentFilter === 'all') {
    html += `<div class="section-label">Pending Action</div>`;
    html += pending.map(b => bookingCard(b)).join('');
    if (others.length > 0) html += `<div class="section-label" style="margin-top:20px;">Other</div>`;
    html += others.map(b => bookingCard(b)).join('');
  } else {
    html += items.map(b => bookingCard(b)).join('');
  }

  list.innerHTML = html;
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ============================================================
// SHARED WORKFLOW HELPERS (Accept / Reject / Contacted / Delete)
// Used by both the Inquiries tab (table: inquiries) and the
// Corporate tab (table: corporate_inquiries) — same status model:
// status: 'new' | 'accepted' | 'rejected', contacted: boolean
// (contacted is only meaningful once accepted).
// ============================================================
async function setEntryStatus(table, id, status, reloadFn) {
  const { error } = await sb.from(table).update({ status }).eq('id', id);
  if (error) { alert('Error: ' + error.message); return; }
  await reloadFn();
}
async function toggleEntryContacted(table, id, current, reloadFn) {
  const { error } = await sb.from(table).update({ contacted: !current }).eq('id', id);
  if (error) { alert('Error: ' + error.message); return; }
  await reloadFn();
}
async function deleteEntry(table, id, label, reloadFn) {
  if (!confirm(`Delete this ${label} permanently? This cannot be undone.`)) return;
  const { error } = await sb.from(table).delete().eq('id', id);
  if (error) { alert('Error: ' + error.message); return; }
  await reloadFn();
}
function workflowActionsHtml(table, id, status, contacted, reloadFnName) {
  if (status === 'new') {
    return `<button class="btn-confirm" onclick="setEntryStatus('${table}','${id}','accepted',${reloadFnName})">Accept</button>
      <button class="btn-decline" onclick="setEntryStatus('${table}','${id}','rejected',${reloadFnName})">Reject</button>
      <button class="btn-delete" onclick="deleteEntry('${table}','${id}','entry',${reloadFnName})">Delete</button>`;
  }
  if (status === 'accepted') {
    return `<button class="btn-contacted${contacted ? ' is-contacted' : ''}" onclick="toggleEntryContacted('${table}','${id}',${contacted},${reloadFnName})">${contacted ? '✓ Contacted' : 'Not yet contacted'}</button>
      <button class="btn-delete" onclick="deleteEntry('${table}','${id}','entry',${reloadFnName})">Delete</button>`;
  }
  // rejected
  return `<button class="btn-alt" onclick="setEntryStatus('${table}','${id}','new',${reloadFnName})">Move back to New</button>
    <button class="btn-delete" onclick="deleteEntry('${table}','${id}','entry',${reloadFnName})">Delete</button>`;
}

// ============================================================
// INQUIRIES TAB (The Buse Method individual applications)
// ============================================================
let allInquiries = [];
let inquiriesLoaded = false;
let currentInquiryFilter = 'new';

function switchTab(tab) {
  document.getElementById('tabBookingsBtn').classList.toggle('active', tab === 'bookings');
  document.getElementById('tabInquiriesBtn').classList.toggle('active', tab === 'inquiries');
  document.getElementById('tabCorporateBtn').classList.toggle('active', tab === 'corporate');
  document.getElementById('tabParticipantsBtn').classList.toggle('active', tab === 'participants');
  document.getElementById('bookingsPanel').style.display = tab === 'bookings' ? 'block' : 'none';
  document.getElementById('inquiriesPanel').style.display = tab === 'inquiries' ? 'block' : 'none';
  document.getElementById('corporatePanel').style.display = tab === 'corporate' ? 'block' : 'none';
  document.getElementById('participantsPanel').style.display = tab === 'participants' ? 'block' : 'none';
  if (tab === 'inquiries' && !inquiriesLoaded) loadInquiries();
  if (tab === 'corporate' && !corporateLoaded) loadCorporateInquiries();
  if (tab === 'participants' && !participantsLoaded) loadParticipants();
}

function setInquiryFilter(filter, btn) {
  currentInquiryFilter = filter;
  btn.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderInquiriesList();
}

async function loadInquiries() {
  const { data, error } = await sb
    .from('inquiries')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    console.error('Failed to load inquiries:', error.message);
    document.getElementById('inquiriesList').innerHTML = `<div class="empty">Could not load inquiries: ${escapeHtml(error.message)}</div>`;
    return;
  }
  inquiriesLoaded = true;
  allInquiries = data || [];
  renderInquiriesStats();
  renderInquiriesList();
}

function renderInquiriesStats() {
  const total = allInquiries.length;
  const newCount = allInquiries.filter(i => (i.status || 'new') === 'new').length;
  const notContacted = allInquiries.filter(i => i.status === 'accepted' && !i.contacted).length;
  const flagged = allInquiries.filter(i => i.parq && Object.values(i.parq).some(v => v === true)).length;

  document.getElementById('inquiriesStatsRow').innerHTML = `
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total</div></div>
    <div class="stat-card"><div class="stat-num">${newCount}</div><div class="stat-label">New</div></div>
    <div class="stat-card"><div class="stat-num">${notContacted}</div><div class="stat-label">Awaiting Contact</div></div>
    <div class="stat-card"><div class="stat-num">${flagged}</div><div class="stat-label">Health Flags</div></div>
  `;
}

function renderInquiriesList() {
  const list = document.getElementById('inquiriesList');
  const items = allInquiries.filter(i => (i.status || 'new') === currentInquiryFilter);
  if (items.length === 0) {
    list.innerHTML = `<div class="empty">No ${currentInquiryFilter} applications.</div>`;
    return;
  }
  list.innerHTML = items.map(i => inquiryCard(i)).join('');
}

const PARQ_LABELS = {
  heart: 'Heart condition',
  chestPain: 'Chest pain during activity',
  balance: 'Dizziness / balance loss',
  jointBone: 'Bone or joint problem',
  medication: 'Currently on medication',
};

function inquiryCard(i) {
  const dateStr = new Date(i.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const parq = i.parq || {};
  const parqFlags = Object.keys(PARQ_LABELS)
    .filter(k => parq[k] === true)
    .map(k => PARQ_LABELS[k]);
  const goals = Array.isArray(i.goals) ? i.goals.join(', ') : '';
  const status = i.status || 'new';

  return `<div class="inquiry-card">
    <div class="iq-top">
      <div>
        <div class="iq-name">${escapeHtml(i.full_name || '(no name)')}</div>
        <div class="iq-contact">${escapeHtml(i.email)}${i.phone ? ' · ' + escapeHtml(i.phone) : ''}</div>
      </div>
      <div class="iq-date">${dateStr}</div>
    </div>
    <div class="iq-fields">
      <div><div class="iq-field-label">Age</div><div class="iq-field-value">${escapeHtml(i.age ?? '—')}</div></div>
      <div><div class="iq-field-label">Preferred Location</div><div class="iq-field-value">${escapeHtml(i.location || '—')}</div></div>
      <div><div class="iq-field-label">Goals</div><div class="iq-field-value">${escapeHtml(goals || '—')}</div></div>
      <div><div class="iq-field-label">Days / Week</div><div class="iq-field-value">${escapeHtml(i.days_per_week || '—')}</div></div>
      <div style="grid-column:1/-1;"><div class="iq-field-label">Health Screening (PAR-Q)</div><div class="iq-field-value">${parqFlags.length ? `<span class="iq-parq-flag">⚠ ${parqFlags.map(escapeHtml).join(', ')}</span>` : 'No flags'}</div></div>
      <div style="grid-column:1/-1;"><div class="iq-field-label">Injuries / Limitations</div><div class="iq-field-value">${escapeHtml(i.injuries || 'None stated')}</div></div>
    </div>
    ${i.intro ? `<div class="iq-note-label">Self-Introduction</div><div class="iq-note">${escapeHtml(i.intro)}</div>` : ''}
    <div class="bc-actions" style="margin-top:14px;">${workflowActionsHtml('inquiries', i.id, status, !!i.contacted, 'loadInquiries')}</div>
  </div>`;
}

// ============================================================
// CORPORATE TAB (corporate.html contact form submissions)
// ============================================================
let allCorporate = [];
let corporateLoaded = false;
let currentCorporateFilter = 'new';

function setCorporateFilter(filter, btn) {
  currentCorporateFilter = filter;
  btn.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCorporateList();
}

async function loadCorporateInquiries() {
  const { data, error } = await sb
    .from('corporate_inquiries')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    console.error('Failed to load corporate inquiries:', error.message);
    document.getElementById('corporateList').innerHTML = `<div class="empty">Could not load corporate inquiries: ${escapeHtml(error.message)}</div>`;
    return;
  }
  corporateLoaded = true;
  allCorporate = data || [];
  renderCorporateStats();
  renderCorporateList();
}

function renderCorporateStats() {
  const total = allCorporate.length;
  const newCount = allCorporate.filter(c => (c.status || 'new') === 'new').length;
  const notContacted = allCorporate.filter(c => c.status === 'accepted' && !c.contacted).length;

  document.getElementById('corporateStatsRow').innerHTML = `
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total</div></div>
    <div class="stat-card"><div class="stat-num">${newCount}</div><div class="stat-label">New</div></div>
    <div class="stat-card"><div class="stat-num">${notContacted}</div><div class="stat-label">Awaiting Contact</div></div>
  `;
}

function renderCorporateList() {

  const items = allCorporate.filter(c => (c.status || 'new') === currentCorporateFilter);
  if (items.length === 0) {
    list.innerHTML = `<div class="empty">No ${currentCorporateFilter} corporate inquiries.</div>`;
    return;
  }

function corporateCard(c) {
  const dateStr = new Date(c.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const status = c.status || 'new';

  return `<div class="inquiry-card">
    <div class="iq-top">
      <div>
        <div class="iq-name">${escapeHtml(c.name)}${c.title ? ' · ' + escapeHtml(c.title) : ''}</div>
        <div class="iq-contact">${escapeHtml(c.company)} · ${escapeHtml(c.email)}</div>
      </div>
      <div class="iq-date">${dateStr}</div>
    </div>
    <div class="iq-fields">
      <div><div class="iq-field-label">Team Size</div><div class="iq-field-value">${escapeHtml(c.team_size || '—')}</div></div>
      <div><div class="iq-field-label">Interested In</div><div class="iq-field-value">${escapeHtml(c.interest || '—')}</div></div>
    </div>
    ${c.message ? `<div class="iq-note-label">Message</div><div class="iq-note">${escapeHtml(c.message)}</div>` : ''}
    <div class="bc-actions" style="margin-top:14px;">${workflowActionsHtml('corporate_inquiries', c.id, status, !!c.contacted, 'loadCorporateInquiries')}</div>
  </div>`;
}

function bookingCard(b) {
  const d = new Date(b.requested_date + 'T00:00:00');
  const dateStr = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  const typeLabel = b.session_type === 'online' ? 'Online' : 'In-Person';

  const badgeMap = {
    pending: '<span class="badge badge-pending">Pending</span>',
    confirmed: '<span class="badge badge-confirmed">Confirmed</span>',
    alternative_proposed: '<span class="badge badge-alternative">Alt Sent</span>',
    cancelled: '<span class="badge badge-cancelled">Declined</span>',
  };

  // Parse notes for multiple slots
  let slotsHtml = `<div class="slot-row"><div class="slot-dot primary"></div>${escapeHtml(dateStr)} · ${escapeHtml(b.requested_time)}</div>`;
  if (b.notes && b.notes.includes('Preferred slots:')) {
    const lines = b.notes.split('\n').filter(l => l.startsWith('Option'));
    if (lines.length > 1) {
      slotsHtml = lines.map((l, i) => `<div class="slot-row"><div class="slot-dot ${i===0?'primary':''}"></div>${escapeHtml(l.replace(/^Option \d+: /,''))}</div>`).join('');
    }
  }

  const notesText = b.notes
    ? b.notes.replace(/Preferred slots:[\s\S]*?(\n\n|$)/,'').replace(/Notes: /,'').trim()
    : '';

  let actionsHtml = '';
  if (b.status === 'pending' || b.status === 'alternative_proposed') {
    actionsHtml = `
      <div class="bc-actions">
        <button class="btn-confirm" onclick="confirmBooking('${b.id}')">
          Confirm ${escapeHtml(b.requested_time)}
        </button>
        <button class="btn-alt" onclick="toggleAlt('${b.id}')">Propose Alternative</button>
        <button class="btn-decline" onclick="declineBooking('${b.id}')">Decline</button>
      </div>
      <div class="alt-panel" id="alt-${b.id}">
        <div style="font-size:12px;color:var(--charcoal-light);margin-bottom:10px;">Propose a different date & time:</div>
        <div class="alt-row">
          <input type="date" id="alt-date-${b.id}" min="${new Date().toISOString().split('T')[0]}">
          <input type="time" id="alt-time-${b.id}" value="10:00" style="width:120px;">
        </div>
        <button class="btn-send-alt" onclick="proposeAlternative('${b.id}')">Send Alternative →</button>
      </div>`;
  } else if (b.status === 'confirmed') {
    const cd = b.confirmed_date || b.requested_date;
    const ct = b.confirmed_time || b.requested_time;
    const cDate = new Date(cd + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    actionsHtml = `<div class="confirmed-info">Session confirmed for ${escapeHtml(cDate)} at ${escapeHtml(ct)}</div>`;
  }

  return `
    <div class="booking-card" id="card-${b.id}">
      <div class="bc-top">
        <div>
          <div class="bc-name">${escapeHtml(b.user_email)}<span class="bc-type">${typeLabel}</span></div>
          <div class="bc-email">${new Date(b.created_at).toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'})}</div>
        </div>
        ${badgeMap[b.status] || ''}
      </div>
      <div class="bc-slots">${slotsHtml}</div>
      ${notesText ? `<div class="bc-note">${escapeHtml(notesText)}</div>` : ''}
      ${actionsHtml}
    </div>`;
}

function toggleAlt(id) {
  document.getElementById('alt-' + id).classList.toggle('show');
}

async function confirmBooking(id) {
  const b = allBookings.find(x => x.id === id);
  if (!b) return;
  const date = b.requested_date, time = b.requested_time;

  const { error } = await sb.from('bookings').update({
    status: 'confirmed',
    confirmed_date: date,
    confirmed_time: time,
  }).eq('id', id);

  if (error) { alert('Error: ' + error.message); return; }

  // Send confirmation email
  await sendEmail(b.user_email, 'confirmed', { date, time });

  await loadBookings();
}

async function proposeAlternative(id) {
  const b = allBookings.find(x => x.id === id);
  if (!b) return;
  const date = document.getElementById('alt-date-' + id).value;
  const time = document.getElementById('alt-time-' + id).value;

  if (!date || !time) { alert('Please select a date and time.'); return; }

  const { error } = await sb.from('bookings').update({
    status: 'alternative_proposed',
    alternative_date: date,
    alternative_time: time,
  }).eq('id', id);

  if (error) { alert('Error: ' + error.message); return; }

  await sendEmail(b.user_email, 'alternative', { date, time });
  await loadBookings();
}

async function declineBooking(id) {
  const b = allBookings.find(x => x.id === id);
  if (!b) return;
  if (!confirm('Are you sure you want to decline this booking?')) return;

  const { error } = await sb.from('bookings').update({ status: 'cancelled' }).eq('id', id);
  if (error) { alert('Error: ' + error.message); return; }

  await sendEmail(b.user_email, 'cancelled', {});
  await loadBookings();
}

async function sendEmail(toEmail, type, data) {
  try {
    const res = await fetch('https://booking-notify.trainwithbuse.workers.dev/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ toEmail, type, data }),
    });
    if (!res.ok) console.error('Email notify failed with status:', res.status);
  } catch(e) { console.error('Email error:', e); }
}

// ============================================================
// PARTICIPANTS TAB (Live Lab Classes — captured via Stripe custom
// checkout fields by the stripe-webhook-worker, read-only here)
// ============================================================
let allParticipants = [];
let participantsLoaded = false;

const CLASS_TIER_LABELS = { founding: 'Founding', standard: 'Standard', annual: 'Annual' };

async function loadParticipants() {
  const { data, error } = await sb
    .from('participants')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    console.error('Failed to load participants:', error.message);
    document.getElementById('participantsList').innerHTML = `<div class="empty">Could not load participants: ${escapeHtml(error.message)}</div>`;
    return;
  }
  participantsLoaded = true;
  allParticipants = data || [];
  renderParticipantsStats();
  renderParticipantsList();
}

function renderParticipantsStats() {
  const total = allParticipants.length;
  const byTier = {};
  allParticipants.forEach(p => { byTier[p.class_tier] = (byTier[p.class_tier] || 0) + 1; });

  const tierCards = Object.keys(CLASS_TIER_LABELS).map(tier =>
    `<div class="stat-card"><div class="stat-num">${byTier[tier] || 0}</div><div class="stat-label">${CLASS_TIER_LABELS[tier]}</div></div>`
  ).join('');

  document.getElementById('participantsStatsRow').innerHTML =
    `<div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total</div></div>` + tierCards;
}

function renderParticipantsList() {
  const list = document.getElementById('participantsList');
  if (allParticipants.length === 0) {
    list.innerHTML = `<div class="empty">No participants yet — they'll appear here automatically once someone completes checkout with the custom fields filled in.</div>`;
    return;
  }
  list.innerHTML = allParticipants.map(p => participantCard(p)).join('');
}

function participantCard(p) {
  const dateStr = new Date(p.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const tierLabel = CLASS_TIER_LABELS[p.class_tier] || p.class_tier;
  return `<div class="inquiry-card">
    <div class="iq-top">
      <div>
        <div class="iq-name">${escapeHtml(p.full_name || '(no name captured)')}</div>
        <div class="iq-contact">${escapeHtml(p.email)}</div>
      </div>
      <div class="iq-date">${dateStr}</div>
    </div>
    <div class="iq-fields">
      <div style="grid-column:1/-1;"><div class="iq-field-label">Class Tier</div><div class="iq-field-value">${escapeHtml(tierLabel)}</div></div>
    </div>
    <div class="bc-actions" style="margin-top:14px;">
      <button class="btn-delete" onclick="deleteEntry('participants','${p.id}','participant',loadParticipants)">Delete</button>
    </div>
  </div>`;
}
</script>
